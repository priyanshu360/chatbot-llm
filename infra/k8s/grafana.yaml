apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: llm-logger
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: PostgreSQL
        type: postgres
        access: proxy
        url: postgres:5432
        user: llmuser
        secureJsonData:
          password: llmpass
        jsonData:
          database: llmlog
          sslmode: disable
          maxOpenConns: 10
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1600
          timescaledb: false
        isDefault: true
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: LLM Inference
        orgId: 1
        folder: LLM
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
  llm-inference-metrics.json: |
    {
      "__inputs": [],
      "__requires": [
        { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "11.0.0" },
        { "type": "datasource", "id": "postgres", "name": "PostgreSQL", "version": "1.0.0" }
      ],
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 20,
          "panels": [],
          "title": "Overview",
          "type": "row"
        },
        {
          "id": 1,
          "title": "Total Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT COUNT(*) AS \"total\" FROM inference_logs WHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model)",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 2,
          "title": "Error Rate",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT COUNT(*) FILTER (WHERE status != 'success') * 100.0 / NULLIF(COUNT(*), 0) AS \"error_rate\" FROM inference_logs WHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model)",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "title": "Avg Latency",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT AVG(latency_ms) AS \"avg_latency\" FROM inference_logs WHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model)",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "purple" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "purple", "value": null }] },
              "unit": "ms"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["mean"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "title": "Total Tokens",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT SUM(total_tokens) AS \"total_tokens\" FROM inference_logs WHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model)",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "green" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 21,
          "panels": [],
          "title": "Latency",
          "type": "row"
        },
        {
          "id": 5,
          "title": "Latency (p50 / p95 / p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT\n  $__timeGroup(created_at, '5m') AS time,\n  percentile_cont(0.50) WITHIN GROUP (ORDER BY latency_ms) AS p50,\n  percentile_cont(0.95) WITHIN GROUP (ORDER BY latency_ms) AS p95,\n  percentile_cont(0.99) WITHIN GROUP (ORDER BY latency_ms) AS p99\nFROM inference_logs\nWHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model)\nGROUP BY 1\nORDER BY 1",
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "ms"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "none" }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 22,
          "panels": [],
          "title": "Throughput",
          "type": "row"
        },
        {
          "id": 6,
          "title": "Requests per Minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT $__timeGroup(created_at, '5m') AS time, COUNT(*) AS \"rpm\" FROM inference_logs WHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model) GROUP BY 1 ORDER BY 1",
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "bars",
                "fillOpacity": 50,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "rpm"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 7,
          "title": "Requests by Provider",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 15 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT provider, COUNT(*) AS count FROM inference_logs WHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model) GROUP BY provider ORDER BY count DESC",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "hideFrom": { "legend": false, "tooltip": false, "viz": false } },
              "mappings": [],
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayLabels": ["percent", "name"],
            "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["value"] },
            "pieType": "pie",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": true },
            "tooltip": { "mode": "single", "sort": "none" }
          }
        },
        {
          "id": 8,
          "title": "Requests by Model",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 15 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT model, COUNT(*) AS count FROM inference_logs WHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model) GROUP BY model ORDER BY count DESC LIMIT 10",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-GrYlRd" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 10,
            "minVizWidth": 0,
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": false },
            "showUnfilled": true,
            "valueMode": "text"
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 23,
          "panels": [],
          "title": "Errors",
          "type": "row"
        },
        {
          "id": 9,
          "title": "Error Rate Over Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT\n  $__timeGroup(created_at, '5m') AS time,\n  COUNT(*) FILTER (WHERE status != 'success') * 100.0 / NULLIF(COUNT(*), 0) AS \"error_rate\"\nFROM inference_logs\nWHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model)\nGROUP BY 1\nORDER BY 1",
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "red" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "dashed" }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 10,
          "title": "Errors by Error Code",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT COALESCE(error_code, 'unknown') AS code, COUNT(*) AS count FROM inference_logs WHERE $__timeFilter(created_at) AND status != 'success' AND provider IN ($provider) AND model IN ($model) GROUP BY error_code ORDER BY count DESC",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-BlPu" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 10,
            "minVizWidth": 0,
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": false },
            "showUnfilled": true,
            "valueMode": "text"
          }
        },
        {
          "id": 11,
          "title": "Recent Errors",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT created_at, provider, model, status, error_code, latency_ms, output_preview FROM inference_logs WHERE $__timeFilter(created_at) AND status != 'success' AND provider IN ($provider) AND model IN ($model) ORDER BY created_at DESC LIMIT 50",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "inspect": false
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "status" },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text",
                      "colorMode": "background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red", "value": null },
                        { "color": "red", "value": "error" },
                        { "color": "orange", "value": "timeout" }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "enablePagination": true, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": []
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 40 },
          "id": 24,
          "panels": [],
          "title": "Token Usage",
          "type": "row"
        },
        {
          "id": 12,
          "title": "Token Consumption Over Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 41 },
          "datasource": { "type": "postgres", "uid": "PostgreSQL" },
          "targets": [
            {
              "rawSql": "SELECT\n  $__timeGroup(created_at, '5m') AS time,\n  SUM(input_tokens) AS \"input\",\n  SUM(output_tokens) AS \"output\",\n  SUM(total_tokens) AS \"total\"\nFROM inference_logs\nWHERE $__timeFilter(created_at) AND provider IN ($provider) AND model IN ($model)\nGROUP BY 1\nORDER BY 1",
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": ["max", "sum"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "none" }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["llm", "inference", "metrics"],
      "templating": {
        "list": [
          {
            "name": "provider",
            "type": "query",
            "query": "SELECT DISTINCT provider FROM inference_logs ORDER BY provider",
            "datasource": { "type": "postgres", "uid": "PostgreSQL" },
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "label": "Provider"
          },
          {
            "name": "model",
            "type": "query",
            "query": "SELECT DISTINCT model FROM inference_logs WHERE provider IN ($provider) ORDER BY model",
            "datasource": { "type": "postgres", "uid": "PostgreSQL" },
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "label": "Model"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "LLM Inference Metrics",
      "uid": "llm-inference-metrics",
      "version": 1,
      "weekStart": ""
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: llm-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.0.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
          subPath: datasource.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboard.yaml
          subPath: dashboard.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/llm-inference-metrics.json
          subPath: llm-inference-metrics.json
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: llm-logger
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
