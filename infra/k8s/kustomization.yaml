apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-logger

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - chat-api.yaml
  - ingestion-api.yaml
  - frontend.yaml
  - grafana.yaml

secretGenerator:
  - name: llm-keys
    literals:
      - OPENAI_API_KEY=sk-placeholder
      - ANTHROPIC_API_KEY=sk-ant-placeholder
      - GEMINI_API_KEY=placeholder
    options:
      disableNameSuffixHash: true
